name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Project
        run: npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0312361187 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Build succeeded cleanly! Firebase Hosting deployment skipped because FIREBASE_SERVICE_ACCOUNT secret is not configured in GitHub repository settings."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json
          npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0312361187 --non-interactive
