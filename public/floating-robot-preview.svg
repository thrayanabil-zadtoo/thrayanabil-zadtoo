<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%" className="w-full h-auto select-none font-sans" dir="rtl">
  <defs>
    <linearGradient id="widgetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051016" />
      <stop offset="50%" stop-color="#0B131C" />
      <stop offset="100%" stop-color="#070D14" />
    </linearGradient>
    <linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.28" />
    </filter>
  </defs>

  {/* Outer Container Border */}
  <rect x="8" y="8" width="304" height="404" rx="22" fill="url(#widgetBg)" stroke="#10b981" stroke-width="2.5" filter="url(#cardGlow)" />

  {/* Top Bar / Header */}
  <path d="M 10 30 Q 10 10 30 10 L 290 10 Q 310 10 310 30 L 310 52 L 10 52 Z" fill="url(#headerGlow)" />
  <line x1="10" y1="52" x2="310" y2="52" stroke="#1e293b" stroke-width="1.2" />

  {/* Live Status Indicator Dot */}
  <circle cx="282" cy="31" r="7" fill="#10b981" />
  <circle cx="282" cy="31" r="11" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />

  {/* Header Title */}
  <text x="264" y="36" fill="#ffffff" font-size="14.5" font-weight="900" text-anchor="end">روبوت نَبض كيوتكس</text>

  {/* 0 Martingale Badge */}
  <rect x="74" y="20" width="68" height="22" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <text x="108" y="35" fill="#34d399" font-size="10.5" font-weight="800" text-anchor="middle">0 مضاعفات</text>

  {/* Minimize Button */}
  <rect x="24" y="20" width="44" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="46" y="35" fill="#94a3b8" font-size="10.5" font-weight="700" text-anchor="middle">تصغير −</text>

  {/* Subscriber & License Info Box */}
  <rect x="22" y="66" width="276" height="54" rx="12" fill="#0e1726" stroke="#1e293b" stroke-width="1" />
  <text x="286" y="87" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="end">العضو المشترك:</text>
  <text x="190" y="87" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="end">حساب المشرف التجريبي (aster...</text>
  <text x="286" y="108" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="end">صلاحية المفتاح:</text>
  <text x="190" y="108" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">نشط (26746 يوم)</text>

  {/* Mode Selector Toggle (Auto / Manual) */}
  <rect x="22" y="132" width="276" height="40" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  {/* Auto Mode Active Tab */}
  <rect x="156" y="136" width="138" height="32" rx="10" fill="#10b981" />
  <text x="225" y="157" fill="#041f17" font-size="13" font-weight="900" text-anchor="middle">🤖 تداول آلي</text>
  {/* Manual Mode Inactive Tab */}
  <text x="86" y="157" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">✋ تداول يدوي</text>

  {/* Current Live Signal Box */}
  <rect x="22" y="184" width="276" height="88" rx="14" fill="#0b1320" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="282" cy="204" r="3" fill="#10b981" />
  <text x="272" y="208" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="end">((•)) إشارة الـ API الحالية:</text>

  {/* Signal Badge */}
  <rect x="36" y="196" width="94" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="83" y="211" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">بانتظار إشارة</text>

  <text x="284" y="236" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="end">الروبوت متصل بالـ API ومستعد لاختيار الزوج وفتح</text>
  <text x="284" y="254" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="end">الصفقة فور صدورها تلقائياً.</text>

  {/* Three Live Stats Counters (Wins / Losses / WinRate) */}
  {/* Wins Box */}
  <rect x="210" y="284" width="88" height="60" rx="10" fill="#061b16" stroke="#10b981" stroke-width="1" />
  <text x="254" y="303" fill="#34d399" font-size="10.5" font-weight="800" text-anchor="middle">✅ الرابحة</text>
  <text x="254" y="331" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">0</text>

  {/* Losses Box */}
  <rect x="116" y="284" width="88" height="60" rx="10" fill="#1e0a12" stroke="#f43f5e" stroke-width="1" />
  <text x="160" y="303" fill="#f43f5e" font-size="10.5" font-weight="800" text-anchor="middle">❌ الخاسرة</text>
  <text x="160" y="331" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">0</text>

  {/* WinRate Box */}
  <rect x="22" y="284" width="88" height="60" rx="10" fill="#1e1708" stroke="#f59e0b" stroke-width="1" />
  <text x="66" y="303" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">🎯 النسبة</text>
  <text x="66" y="331" fill="#fcd34d" font-size="17" font-weight="900" text-anchor="middle">100%</text>

  {/* Bottom Trade Stake Selector & Alert Toggle */}
  <rect x="22" y="356" width="276" height="42" rx="10" fill="#0a101b" stroke="#1e293b" stroke-width="1" />
  <text x="286" y="381" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="end">المبلغ ($):</text>

  {/* Stake Buttons */}
  <rect x="212" y="364" width="26" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="225" y="381" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">$1</text>

  {/* Active $5 Button */}
  <rect x="178" y="364" width="28" height="26" rx="6" fill="#10b981" />
  <text x="192" y="381" fill="#032018" font-size="11" font-weight="900" text-anchor="middle">$5</text>

  <rect x="140" y="364" width="32" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="156" y="381" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">$10</text>

  <rect x="102" y="364" width="32" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="118" y="381" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">$20</text>

  {/* Alert Button */}
  <rect x="30" y="364" width="58" height="26" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
  <text x="59" y="381" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">🔔 تنبيه</text>
</svg>
